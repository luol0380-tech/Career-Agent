        if (window.CareerAgent && window.CareerAgent.onAssetFailure) window.CareerAgent.onAssetFailure(name);
      }

      rel="stylesheet"

  <body class="ca-body antialiased">
    <a class="ca-skip" href="#ca-main" onclick="document.getElementById('ca-main').focus(); return false;">跳到主要内容</a>

    <div id="ca-asset-warning" class="ca-asset-warning" role="alert" hidden></div>

    <header class="ca-header">
      <div class="ca-brand">
        <div class="ca-brand__title-group">
          <span class="ca-brand__name"><svg class="ca-brand__logo" viewBox="0 0 48 48" aria-hidden="true" focusable="false"><path d="M8 21 7 7l13 8a24 24 0 0 1 8 0l13-8-1 14c3 4 4 8 2 13-3 7-12 10-18 10S9 41 6 34c-2-5-1-9 2-13Z" fill="#ffda63" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/><path d="m11 13 5 4m21-4-5 4" stroke="#ef999e" stroke-width="3" stroke-linecap="round"/><circle cx="17" cy="26" r="2" fill="currentColor"/><circle cx="31" cy="26" r="2" fill="currentColor"/><path d="m22 31 2 2 2-2m-2 2v2m0 0c-2 3-5 2-6 0m6 0c2 3 5 2 6 0M6 28l7 2m-7 5 7-2m29-5-7 2m7 5-7-2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>猫猫求职助手</span>
          <span class="ca-brand__tagline">把经历整理成下一步行动</span>
        </div>
      </div>
      <div class="ca-header__controls">
        <div class="ca-goal">
          <label for="ca-goal-select" class="ca-goal__label">当前求职目标</label>
          <select id="ca-goal-select" class="ca-input ca-input--sm" disabled>
            <option value="">读取中…</option>
          </select>
          <span id="ca-goal-hint" class="ca-goal__hint" aria-live="polite"></span>
        </div>
        <button id="ca-reset" type="button" class="ca-btn ca-btn--ghost ca-btn--sm" disabled>
          <i class="fa fa-undo ca-icon" aria-hidden="true"></i><span>重置演示</span>
        </button>
      </div>
    </header>

    <div class="ca-layout">
      <nav class="ca-nav" aria-label="主导航">
        <section class="ca-profile-card" aria-labelledby="ca-profile-title">
          <div class="ca-profile-avatar" aria-hidden="true">林</div>
          <div>
            <h2 id="ca-profile-title">林小舟</h2>
            <p>求职进展进行中</p>
          </div>
          <dl>
            <div><dt>目标岗位</dt><dd>产品经理</dd></div>
            <div><dt>期望薪资</dt><dd>未设置</dd></div>
          </dl>
        </section>
        <ul class="ca-nav__list">
          <li>
            <a class="ca-nav__link" href="#/home" data-route="home"
              ><i class="fa fa-compass ca-icon" aria-hidden="true"></i><span>求职进展</span></a
            >
          </li>
          <li>
            <a class="ca-nav__link" href="#/resume" data-route="resume"
              ><i class="fa fa-file-text-o ca-icon" aria-hidden="true"></i><span>我的简历</span></a
            >
          </li>
          <li>
            <a class="ca-nav__link" href="#/vault" data-route="vault"
              ><i class="fa fa-archive ca-icon" aria-hidden="true"></i><span>职业资产</span></a
            >
          </li>
          <li>
            <a class="ca-nav__link" href="#/jobs" data-route="jobs"
              ><i class="fa fa-briefcase ca-icon" aria-hidden="true"></i><span>岗位工作区</span></a
            >
          </li>
        </ul>
        <p id="ca-storage-note" class="ca-nav__note">保存位置：当前浏览器本地（不同步云端）</p>
        <p class="ca-nav__note ca-nav__note--extra">演示 Beta：未接入真实 AI、自动投递或账号系统。</p>
      </nav>

      <main id="ca-main" class="ca-main" tabindex="-1">
        <div id="ca-banners" class="ca-banners"></div>
        <div id="ca-view">
          <noscript>
            <div class="ca-state ca-state--error">
              <p class="ca-state__title">需要启用 JavaScript</p>
              <p class="ca-state__message">本演示页面依赖浏览器脚本读取本地演示数据，请启用 JavaScript 后刷新。</p>
            </div>
          </noscript>
          <div id="ca-boot" class="ca-state ca-state--loading" role="status">
            <p class="ca-state__title">正在加载页面脚本…</p>
          </div>
        </div>
      </main>
    </div>

    <div id="ca-toasts" class="ca-toasts" role="status" aria-live="polite"></div>

    <script>
      setTimeout(function () {
        if (window.CareerAgent && window.CareerAgent.booted) return;
        var boot = document.getElementById('ca-boot');
        if (!boot) return;
        boot.className = 'ca-state ca-state--error';
        boot.setAttribute('role', 'alert');
        boot.innerHTML = '';
        var title = document.createElement('p');
        title.className = 'ca-state__title';
        title.textContent = '页面脚本未能完成加载';
        var msg = document.createElement('p');
        msg.className = 'ca-state__message';
        msg.textContent = '本地脚本文件缺失或执行出错，页面无法显示演示数据。请确认 app 目录完整后刷新；如仍失败，可在浏览器控制台查看错误。';
        boot.appendChild(title);
        boot.appendChild(msg);
      }, 6000);
    </script>
  </body>
</html>
